<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07080c">
    <title>The mix, on ZAO MixZ</title>
    <meta name="description" content="Every song from this set, in order, with a link to each one. Press play to hear it again.">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/remote-192.png">
    <style>
        :root { --bg: #07080c; --panel: #0f1118; --hi: #161924; --line: rgba(255,255,255,.1); --text: #f1f3f8; --muted: #8a90a6; --a: #00d4ff; --b: #ff6b35; --play: #2bff9a; }
        * { box-sizing: border-box; }
        html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { padding: 0 16px calc(96px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }
        a { color: var(--a); }
        header { padding: 28px 0 18px; }
        .brand { font-weight: 800; letter-spacing: .04em; font-size: .9rem; color: var(--muted); }
        .brand span { color: var(--a); }
        h1 { margin: 10px 0 4px; font-size: clamp(1.6rem, 6vw, 2.4rem); line-height: 1.1; letter-spacing: -.01em; }
        .sub { color: var(--muted); font-size: .95rem; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .chip { font-size: .72rem; letter-spacing: .1em; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
        .chip.live { color: var(--play); border-color: rgba(43,255,154,.5); }
        .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
        button { font: inherit; color: var(--text); background: var(--hi); border: 1px solid var(--line); border-radius: 12px; padding: 0 18px; min-height: 48px; cursor: pointer; font-weight: 700; letter-spacing: .06em; }
        button:active { transform: scale(.98); }
        button.go { color: var(--play); border-color: rgba(43,255,154,.4); }
        button.ghost { color: var(--muted); }
        ol { list-style: none; margin: 18px 0 0; padding: 0; }
        li { display: grid; grid-template-columns: 34px 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
        li.now { background: linear-gradient(90deg, rgba(43,255,154,.08), transparent); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 10px; }
        .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .85rem; }
        .art { width: 52px; height: 52px; border-radius: 8px; background: var(--hi) center/cover; }
        .t b { display: block; font-size: 1.02rem; }
        .t small { display: block; color: var(--muted); margin-top: 2px; }
        .t small a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
        .t .at { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .78rem; margin-top: 3px; }
        .play { min-height: 44px; min-width: 64px; padding: 0 12px; font-size: .78rem; }
        li.now .play { color: var(--play); }
        .play[disabled] { opacity: .35; cursor: default; }
        .empty { color: var(--muted); padding: 40px 0; text-align: center; line-height: 1.6; }
        .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(15,17,24,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
        .bar .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; }
        .bar .np { min-width: 0; }
        .bar .np b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bar .np small { color: var(--muted); }
        .bar .prog { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--hi); overflow: hidden; }
        .bar .prog i { display: block; height: 100%; width: 0; background: var(--play); }
        .hidden { display: none !important; }
        footer { margin-top: 36px; color: var(--muted); font-size: .8rem; line-height: 1.6; }
    </style>
</head>
<body>
    <header>
        <div class="brand">ZAO <span>MixZ</span></div>
        <h1 id="name">The mix</h1>
        <div class="sub" id="sub"></div>
        <div class="chips" id="chips"></div>
        <div class="actions">
            <button class="go" id="play-all">PLAY THE MIX</button>
            <button class="ghost" id="copy">COPY THIS LINK</button>
            <button class="ghost" id="mixz-link">OPEN ZAO MIXZ</button>
        </div>
    </header>
    <ol id="list"><li class="empty" style="display:block">Reading the set</li></ol>
    <footer>Every song here plays from where its artist put it: SongChainn or Audius. Open a song to follow the artist. Mixed live on <a href="/">ZAO MixZ</a>.</footer>

    <div class="bar hidden" id="bar">
        <div class="in">
            <div class="np"><b id="bar-title"></b><small id="bar-artist"></small></div>
            <button id="bar-prev" class="ghost">PREV</button>
            <button id="bar-next" class="ghost">NEXT</button>
            <div class="prog"><i id="bar-prog"></i></div>
        </div>
    </div>
    <audio id="player" preload="none"></audio>

    <script src="music-source.js"></script>
    <script type="module">
        import { decodeMix, resolveTracks, fmtTime, mixLength } from './dj/MixPage.js';
        import { parseMixHash, watchLive, watchRoom, roomHeld, isLiveNow } from './dj/LiveMix.js';
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        $('copy').onclick = () => { navigator.clipboard?.writeText(location.href); $('copy').textContent = 'COPIED'; setTimeout(() => { $('copy').textContent = 'COPY THIS LINK'; }, 1500); };
        $('mixz-link').onclick = () => { location.href = '/'; };

        // A #m= link holds the set itself. A #live= link follows the DJ's set as it plays
        // (LiveMix.js); the page then keeps the latest set in its own address too.
        const hash = parseMixHash(location.hash);
        // Another mix link pasted into this tab: read it from the start (replaceState below does not fire this)
        addEventListener('hashchange', () => location.reload());
        const say = (text) => { $('list').innerHTML = `<li class="empty" style="display:block">${esc(text)}</li>`; };
        const list = $('list');
        const player = $('player');
        let tracks = [];
        let cur = -1;
        let heardAt = 0;
        let signedAt = 0;   // when the desk signed the set this page shows (LIVE NOW comes from this)
        let holder = null;   // in a lobby: the claim of whoever holds it (LiveMix.js)
        const keyOf = (t) => (t ? `${t.src}|${t.id || t.title}|${t.at}` : '');
        const resolved = new Map();   // a song already looked up is not fetched again

        const draw = () => {
            list.innerHTML = tracks.map((t) => `
                <li data-n="${t.n}" class="${t.n === cur ? 'now' : ''}">
                    <span class="n">${String(t.n + 1).padStart(2, '0')}</span>
                    <span class="art" style="${t.art ? `background-image:url(&quot;${esc(t.art)}&quot;)` : ''}"></span>
                    <span class="t"><b>${esc(t.title || 'Loading')}</b><small>${esc(t.artist)}${t.page ? ` · <a href="${esc(t.page)}" target="_blank" rel="noopener">${t.src === 'audius' ? 'on Audius' : 'on SongChainn'}</a>` : t.src === 'local' ? ' · from the DJ\'s own files' : ''}</small><span class="at">${fmtTime(t.at)}${t.du ? ` for ${fmtTime(t.du)}` : ''}</span></span>
                    <button class="play" data-play="${t.n}" ${t.stream ? '' : 'disabled'}>${t.stream ? (t.n === cur && !player.paused ? 'PLAYING' : 'PLAY') : 'NO STREAM'}</button>
                </li>`).join('');
        };
        const header = (mix) => {
            const when = mix.d ? new Date(mix.d + 'Z') : null;
            const dateText = when && !isNaN(when) ? when.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '';
            $('name').textContent = mix.n || `The mix${dateText ? ', ' + dateText : ''}`;
            document.title = `${$('name').textContent} · ZAO MixZ`;
            $('sub').textContent = [mix.dj ? `Mixed by ${mix.dj}` : '', mix.n && dateText ? dateText : ''].filter(Boolean).join(' · ');
            const len = mixLength(mix);
            const live = hash.live && heardAt && isLiveNow(signedAt);
            // A set read from the address under a live link, before the desk's signed copy arrives
            const unconfirmed = hash.live && !heardAt && hash.m ? '<span class="chip">FROM THIS LINK, NOT YET CONFIRMED BY THE DJ</span>' : '';
            const lob = holder ? `<span class="chip">LOBBY ${esc(holder.name.toUpperCase())}${roomHeld(holder, Date.now()) ? '' : ': FREE'}</span>` : '';
            $('chips').innerHTML = `${live ? '<span class="chip live">LIVE NOW</span>' : ''}${unconfirmed}${lob}<span class="chip">${mix.t.length} ${mix.t.length === 1 ? 'SONG' : 'SONGS'}</span>${len ? `<span class="chip">${Math.round(len / 60)} MIN</span>` : ''}`;
        };
        let showing = 0;
        const show = async (mix) => {
            const mine = ++showing;
            header(mix);
            const playing = keyOf(tracks[cur]);
            const next = mix.t.map((e, n) => ({ n, src: e[0] === 'lo' ? 'local' : e[0] === 'sc' ? 'songchainn' : 'audius', id: e[0] === 'lo' ? '' : e[1], title: e[0] === 'lo' ? e[1] : '', artist: e[0] === 'lo' ? e[2] : '', at: e[0] === 'lo' ? e[3] : e[2], du: e[0] === 'lo' ? e[4] : e[3], art: null, stream: null, page: null }));
            for (const t of next) Object.assign(t, resolved.get(`${t.src}|${t.id || t.title}`) || {});
            tracks = next; cur = tracks.findIndex((t) => keyOf(t) === playing); draw();
            const looked = await resolveTracks(mix);
            if (mine !== showing) return;   // a newer set arrived while these were looked up
            for (const t of looked) { const { title, artist, art, stream, page } = t; resolved.set(`${t.src}|${t.id || t.title}`, { title, artist, art, stream, page }); }
            tracks = looked; cur = tracks.findIndex((t) => keyOf(t) === playing); draw();
            $('play-all').disabled = !tracks.some((t) => t.stream);
        };

        // Hearing it again: one song after the next, in the order they were played.
        const playable = () => tracks.filter((t) => t.stream);
        const playN = (n) => {
            const t = tracks[n];
            if (!t?.stream) return;
            cur = n;
            player.src = t.stream;
            player.play().catch(() => {});
            $('bar').classList.remove('hidden');
            $('bar-title').textContent = t.title; $('bar-artist').textContent = t.artist;
            draw();
        };
        // Songs added while one plays are picked up here: the list is read again at each step
        const step = (dir) => { const ns = playable().map((t) => t.n); const i = ns.indexOf(cur); const next = ns[i + dir]; if (next != null) playN(next); else if (dir > 0) { player.pause(); $('bar').classList.add('hidden'); draw(); } };
        player.addEventListener('ended', () => step(1));
        player.addEventListener('timeupdate', () => { $('bar-prog').style.width = player.duration ? `${(player.currentTime / player.duration) * 100}%` : '0'; });
        $('play-all').onclick = () => { const first = playable()[0]; if (first) playN(first.n); };
        $('bar-next').onclick = () => step(1);
        $('bar-prev').onclick = () => step(-1);
        list.addEventListener('click', (e) => { const b = e.target.closest('[data-play]'); if (b && !b.disabled) { const n = Number(b.dataset.play); if (n === cur && !player.paused) { player.pause(); draw(); } else playN(n); } });

        const snapshot = hash.m && !hash.lobby ? decodeMix(hash.m) : null;
        // The set of one host, as it plays. In a lobby the address stays the lobby's link.
        let heard = false;
        const onLive = (u) => {
            heard = true; heardAt = Date.now(); signedAt = u.ts;
            hash.m = u.m;
            // The set in the address too, so a copy of this link keeps the mix whatever the relay does
            if (!hash.lobby) { try { history.replaceState(null, '', `#live=${hash.live}&m=${u.m}`); } catch (e) { /* address stays */ } }
            if (u.mix.t.length) show(u.mix); else { header(u.mix); say('The DJ is on. The first song shows here when it plays.'); }
        };
        if (!snapshot && !hash.live && !hash.lobby) {
            say('This link is not a mix. Ask the DJ for the link again, or open ZAO MixZ and press SHARE THE MIX.');
            $('play-all').disabled = true;
        } else {
            $('play-all').disabled = true;
            if (snapshot) show(snapshot); else say(hash.lobby ? `Looking for whoever hosts the lobby "${hash.lobby}".` : 'Waiting for the set. The songs show here as the DJ plays them.');
            setInterval(() => { if (tracks.length) header(decodeMix(hash.m) || { t: [] }); }, 15000);
            if (hash.lobby) {
                setTimeout(() => { if (!holder) say(`Nobody is hosting the lobby "${hash.lobby}" right now. Keep this page open: the set shows here the moment a host claims it.`); }, 12000);
                let stopLive = null;
                watchRoom(hash.lobby, (h) => {
                    const changed = h.pub !== holder?.pub;
                    holder = h;
                    if (!changed) { if (hash.m) header(decodeMix(hash.m) || { t: [] }); return; }
                    // A new host: their set replaces the last one
                    stopLive?.(); hash.live = h.pub; hash.m = ''; heard = false; tracks = []; cur = -1; player.pause();
                    say(`${h.name} holds this lobby. Their set shows here as they play.`);
                    watchLive(h.pub, onLive).then((stop) => { stopLive = stop; }).catch(() => say('Could not reach the live set right now. Try again in a minute.'));
                }).catch(() => say('Could not reach the lobby right now. Try again in a minute.'));
            } else if (hash.live) {
                setTimeout(() => { if (!heard && !snapshot) say('Nothing from the DJ yet. The set may not have started, or it ended long enough ago that the relay no longer holds it. Keep this page open: songs show here the moment the DJ plays.'); }, 12000);
                watchLive(hash.live, onLive).catch(() => { if (!snapshot) say('Could not reach the live set right now. Try again in a minute.'); });
            }
        }
    </script>
</body>
</html>
